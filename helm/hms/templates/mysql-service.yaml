apiVersion: v1
kind: Service
metadata:
  name: {{ include "hms.fullname" . }}-mysql
  labels:
    {{- include "hms.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.mysql.port }}
      targetPort: {{ .Values.mysql.port }}
      name: mysql
  selector:
    app.kubernetes.io/name: {{ include "hms.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: database
